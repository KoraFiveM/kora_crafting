name: Bug report
description: Report something that is not working in kora_crafting.
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first and report one problem at a time. Remove passwords, tokens,
        connection strings and player identifiers from text and attachments. For a suspected
        vulnerability, use the repository Security tab or its security policy instead of a public
        issue.
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what should have happened?
      description: Describe one problem in kora_crafting and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List what you did in order. If it happens only sometimes, say how often.
      placeholder: |-
        1. Start with…
        2. Do…
        3. Observe…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kora_crafting version or commit
      description: >-
        Use the installed release, fxmanifest.lua version, or Git commit. If unavailable, write
        "Unknown" and say when you downloaded it.
      placeholder: Release/tag or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Recipes and stations
        - Creator UI
        - Crafting actions
        - Persistence and logs
        - Other / not sure
  - type: textarea
    id: context
    attributes:
      label: Resource details (optional)
      description: >-
        Name the station, recipe and ingredient quantities. Say whether crafting, cancellation,
        creator saving or output delivery failed.
  - type: textarea
    id: environment
    attributes:
      label: Setup (optional)
      description: >-
        Include FXServer artifact/game build, relevant dependency versions and custom changes if
        known. Do not paste your full server.cfg.
  - type: textarea
    id: logs
    attributes:
      label: Relevant error or log (optional)
      description: Copy the nearby F8/client or server console error. Remove secrets and player data.
      render: text
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video (optional)
      description: >-
        Drag in an image or add a clip link if it helps show the problem. Check attachments for
        private information.
